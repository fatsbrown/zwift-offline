name: pyinstaller

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller garth==0.6.3

    - name: Download and extract UPX
      run: |
        $url = "https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip"
        $output = "$env:TEMP\upx.zip"
        $extractPath = "$env:TEMP\upx"
        Invoke-WebRequest -Uri $url -OutFile $output
        Expand-Archive -Path $output -DestinationPath $extractPath -Force
        Add-Content -Path $env:GITHUB_PATH -Value "$extractPath\upx-5.2.1-win64"

    - name: Build executable
      run: |
        pyinstaller standalone.spec

    - name: Create zip
      run: |
        Compress-Archive -Path .\dist\* -DestinationPath .\zoffline-latest.zip

    - name: Upload to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload zoffline-latest zoffline-latest.zip --clobber

    - name: Update tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f zoffline-latest
        git push origin zoffline-latest --force
