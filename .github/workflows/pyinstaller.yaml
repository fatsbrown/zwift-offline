name: pyinstaller

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller garth==0.6.3

    - name: Download and extract UPX
      run: |
        $url = "https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip"
        $output = "$env:TEMP\upx.zip"
        $extractPath = "$env:TEMP\upx"
        Invoke-WebRequest -Uri $url -OutFile $output
        Expand-Archive -Path $output -DestinationPath $extractPath -Force
        Add-Content -Path $env:GITHUB_PATH -Value "$extractPath\upx-5.2.1-win64"

    - name: Build executable
      run: |
        pyinstaller standalone.spec

    - name: Create zip
      run: |
        Compress-Archive -Path .\dist\* -DestinationPath .\zoffline-latest.zip

    - name: Update tag and release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f zoffline-latest
        git push origin zoffline-latest --force
        VERSION=$(xmllint --xpath "string(//Zwift/@sversion)" cdn/gameassets/Zwift_Updates_Root/Zwift_ver_cur.xml)
        cat << EOF > notes.md
        zoffline Windows only standalone executable for Zwift $VERSION.

        Note: The executable is made with pyinstaller. An unfortunate side effect is that some anti-virus software may falsely flag pyinstaller executables as malware. This is a [known issue](https://github.com/pyinstaller/pyinstaller/issues?q=is%3Aissue%20label%3Aantivirus-false-positives) and unavoidable. If you prefer, you can not use this exe and instead run zoffline directly from the source code (2nd installation method in the README).
        EOF
        gh release edit zoffline-latest --title "zoffline for Zwift $VERSION" --notes-file notes.md
        gh release upload zoffline-latest zoffline-latest.zip --clobber
